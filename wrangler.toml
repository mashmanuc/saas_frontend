# Cloudflare Pages configuration for M4SH Frontend
# This file tells Cloudflare how to build and deploy your frontend

name = "m4sh-frontend"

[build]
command = "npm run build"
output_directory = "dist"

# Cloudflare Pages specific setting
pages_build_output_dir = "dist"

[build.environment]
NODE_VERSION = "20"

# Security headers + CSP (Phase 2 — docs/security/PROGRESS.md)
# IMPORTANT: Report-Only mode first. Switch to Content-Security-Policy after validation.
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=()"
Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.m4sh.org https://saas-backend-rough-dawn-1961.fly.dev wss://saas-backend-rough-dawn-1961.fly.dev; img-src 'self' data: blob: https://images.m4sh.org https://m4sh.org; font-src 'self' data:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://www.liqpay.ua; upgrade-insecure-requests"

# Cache static assets
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
