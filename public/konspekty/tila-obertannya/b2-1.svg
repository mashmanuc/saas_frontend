<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" width="360" height="270" class="geo" font-family="Manrope, Arial, sans-serif"><style>.geo{font-family:'JetBrains Mono','Manrope',sans-serif;font-size:13px;}
.geo .face{fill:#eaf5ef;stroke:#0e7a5f;stroke-width:1.6;stroke-linejoin:round;}
.geo .face-back{fill:#dde9e2;stroke:#0e7a5f;stroke-width:1.4;stroke-linejoin:round;}
.geo .face-top{fill:#cfe1d6;stroke:#0e7a5f;stroke-width:1.4;stroke-linejoin:round;}
.geo .edge{fill:none;stroke:#0e7a5f;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;}
.geo .edge-hidden{fill:none;stroke:#7ea99a;stroke-width:1.2;stroke-dasharray:4 3;stroke-linecap:round;}
.geo .axis{fill:none;stroke:#345148;stroke-width:1.2;}
.geo .grid{fill:none;stroke:#cbded3;stroke-width:0.8;}
.geo .curve{fill:none;stroke:#0e7a5f;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.geo .curve-2{fill:none;stroke:#1f8a5b;stroke-width:2;stroke-linecap:round;}
.geo .accent{stroke:#e07a3c;fill:none;stroke-width:1.8;stroke-linecap:round;}
.geo .accent-fill{stroke:#e07a3c;fill:#fbe7d7;stroke-width:1.6;}
.geo .dim{fill:none;stroke:#e07a3c;stroke-width:1.6;stroke-dasharray:4 3;stroke-linecap:round;}
.geo .vert{fill:#0f2620;}
.geo text{fill:#0f2620;font-weight:500;}
.geo text.lbl{fill:#345148;font-size:12px;}
.geo text.lbl-acc{fill:#c25a1c;font-size:12.5px;font-weight:600;}
.geo text.vlbl{fill:#0f2620;font-size:13px;font-weight:700;}</style><rect x="0" y="0" width="360" height="270" fill="#ffffff"/><polygon class="face" points="180,30 90,200 270,200"></polygon><ellipse class="face-top" cx="180" cy="200" rx="90" ry="22"></ellipse><path class="edge" d="M 90 200 A 90 22 0 0 0 270 200"></path><path class="edge-hidden" d="M 90 200 A 90 22 0 0 1 270 200"></path><line class="edge" x1="180" x2="90" y1="30" y2="200"></line><line class="edge" x1="180" x2="270" y1="30" y2="200"></line><line class="dim" x1="180" x2="180" y1="30" y2="200"></line><line class="accent" x1="180" x2="270" y1="200" y2="200"></line><circle cx="180" cy="200" fill="#0f2620" r="2.5"></circle><text class="lbl-acc" x="188" y="118">h</text><text class="lbl-acc" x="218" y="194">R</text><text class="lbl-acc" transform="rotate(62 242 118)" x="242" y="118">ℓ</text><text x="180.0" y="261.0" text-anchor="middle" font-size="15" font-weight="600" font-family="Manrope, Arial, sans-serif" fill="#345148">Конус: R — радіус основи, h — висота, ℓ — твірна. Зв’язок: ² = R² + h².</text></svg>