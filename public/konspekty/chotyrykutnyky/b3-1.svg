<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="380" height="230" class="geo" font-family="Manrope, Arial, sans-serif"><style>.geo{font-family:'JetBrains Mono','Manrope',sans-serif;font-size:13px;}
.geo .face{fill:#eaf5ef;stroke:#0e7a5f;stroke-width:1.6;stroke-linejoin:round;}
.geo .face-back{fill:#dde9e2;stroke:#0e7a5f;stroke-width:1.4;stroke-linejoin:round;}
.geo .face-top{fill:#cfe1d6;stroke:#0e7a5f;stroke-width:1.4;stroke-linejoin:round;}
.geo .edge{fill:none;stroke:#0e7a5f;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;}
.geo .edge-hidden{fill:none;stroke:#7ea99a;stroke-width:1.2;stroke-dasharray:4 3;stroke-linecap:round;}
.geo .axis{fill:none;stroke:#345148;stroke-width:1.2;}
.geo .grid{fill:none;stroke:#cbded3;stroke-width:0.8;}
.geo .curve{fill:none;stroke:#0e7a5f;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.geo .curve-2{fill:none;stroke:#1f8a5b;stroke-width:2;stroke-linecap:round;}
.geo .accent{stroke:#e07a3c;fill:none;stroke-width:1.8;stroke-linecap:round;}
.geo .accent-fill{stroke:#e07a3c;fill:#fbe7d7;stroke-width:1.6;}
.geo .dim{fill:none;stroke:#e07a3c;stroke-width:1.6;stroke-dasharray:4 3;stroke-linecap:round;}
.geo .vert{fill:#0f2620;}
.geo text{fill:#0f2620;font-weight:500;}
.geo text.lbl{fill:#345148;font-size:12px;}
.geo text.lbl-acc{fill:#c25a1c;font-size:12.5px;font-weight:600;}
.geo text.vlbl{fill:#0f2620;font-size:13px;font-weight:700;}</style><rect x="0" y="0" width="380" height="230" fill="#ffffff"/><polygon class="face" points="30,160 350,160 290,40 90,40"></polygon><line class="dim" x1="190" x2="190" y1="40" y2="160"></line><path class="edge" d="M190 148 h-12 v12"></path><line class="accent" x1="60" x2="320" y1="100" y2="100"></line><circle cx="60" cy="100" fill="#0f2620" r="2.5"></circle><circle cx="320" cy="100" fill="#0f2620" r="2.5"></circle><g class="vlbl"><text x="20" y="176">A</text><text x="352" y="176">B</text><text x="294" y="34">C</text><text x="80" y="34">D</text></g><text class="lbl" text-anchor="middle" x="190" y="180">a</text><text class="lbl" text-anchor="middle" x="190" y="32">b</text><text class="lbl-acc" x="335" y="96">m</text><text class="lbl-acc" x="196" y="108">h</text><text x="190.0" y="221.0" text-anchor="middle" font-size="15" font-weight="600" font-family="Manrope, Arial, sans-serif" fill="#345148">m = a+b2 — середня лінія. h — висота (перпендикуляр між основами).</text></svg>