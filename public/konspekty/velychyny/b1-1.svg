<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" font-family="Manrope, Arial, sans-serif"><rect x="0" y="0" width="320" height="120" fill="#ffffff"/><line stroke="#0e7a5f" stroke-linecap="round" stroke-width="4" x1="20" x2="120" y1="40" y2="40"></line><text fill="#0f2620" font-family="Manrope" font-size="12" font-weight="700" text-anchor="middle" x="70" y="28">1 дм = 10 см</text><rect fill="#eaf5ef" height="50" stroke="#0e7a5f" stroke-width="2" width="50" x="150" y="15"></rect><text fill="#0f2620" font-family="Manrope" font-size="12" font-weight="700" text-anchor="middle" x="175" y="85">1 дм² = 100 см²</text><polygon fill="#fbe7d7" points="240,30 280,30 300,15 260,15" stroke="#e07a3c" stroke-width="2"></polygon><rect fill="#fbe7d7" height="40" stroke="#e07a3c" stroke-width="2" width="40" x="240" y="30"></rect><polygon fill="#fbe7d7" points="280,30 300,15 300,55 280,70" stroke="#e07a3c" stroke-width="2"></polygon><text fill="#0f2620" font-family="Manrope" font-size="12" font-weight="700" text-anchor="middle" x="270" y="95">1 дм³ = 1000 см³</text><text fill="#e07a3c" font-family="Manrope" font-size="12" font-weight="700" text-anchor="middle" x="270" y="112">= 1 л</text></svg>