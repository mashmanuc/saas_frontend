<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="1600" height="900" fill="#ffffff"/>
<text x="80" y="88" font-size="30" font-weight="600" fill="#c2410c">M4SH · Presentation</text>
<text x="1520" y="88" font-size="30" fill="#94a3b8" text-anchor="end">2 / 3</text>
<line x1="80" y1="118" x2="1520" y2="118" stroke="#e2e8f0" stroke-width="2"/>
<text x="80" y="210" font-size="30" font-weight="600" fill="#c2410c" letter-spacing="1">THE IDENTITY</text>
<text x="80" y="292" font-size="62" font-weight="700" fill="#0f172a">Sine of a double angle</text>
<text x="80" y="370" font-size="36" fill="#334155">This folds the product into a single sine:</text>
<rect x="80" y="442" width="1440" height="238" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
<text x="800" y="534" font-size="52" font-weight="600" fill="#0f172a" text-anchor="middle">sin 2α = 2 · sin α · cos α</text>
<text x="800" y="618" font-size="52" font-weight="600" fill="#0f172a" text-anchor="middle">sin α · cos α = ½ · sin 2α</text>
</svg>