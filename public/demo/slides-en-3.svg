<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="1600" height="900" fill="#ffffff"/>
<text x="80" y="88" font-size="30" font-weight="600" fill="#c2410c">M4SH · Presentation</text>
<text x="1520" y="88" font-size="30" fill="#94a3b8" text-anchor="end">3 / 3</text>
<line x1="80" y1="118" x2="1520" y2="118" stroke="#e2e8f0" stroke-width="2"/>
<text x="80" y="210" font-size="30" font-weight="600" fill="#c2410c" letter-spacing="1">THE ANSWER</text>
<text x="80" y="292" font-size="62" font-weight="700" fill="#0f172a">Substituting 165°</text>
<text x="80" y="370" font-size="36" fill="#334155">Spin the circle next to this deck to 165°, then 330° —</text>
<text x="80" y="424" font-size="36" fill="#334155">the sign of the answer is visible on the circle itself.</text>
<rect x="80" y="496" width="1440" height="238" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
<text x="800" y="588" font-size="52" font-weight="600" fill="#0f172a" text-anchor="middle">sin 165° · cos 165° = ½ · sin 330°</text>
<text x="800" y="672" font-size="52" font-weight="600" fill="#0f172a" text-anchor="middle">= ½ · (−½) = −¼</text>
</svg>