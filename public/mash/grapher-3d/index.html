.mq-field3d .mq-math-mode{font-size:var(--sb-font,13px)}
.expr-input::placeholder{color:#bbb}
.expr-err{font-size:calc(var(--sb-font,13px)*0.85);color:var(--red);padding:2px 0 2px 22px;display:none}
.expr-err.show{display:block}
.icon-btn{width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:#ccc;border-radius:3px;flex-shrink:0;font-size:13px}
.icon-btn:hover{color:var(--text);background:#f0f0f0}
.drag-handle{cursor:grab;color:#ccc;font-size:11px;flex-shrink:0;user-select:none;padding:0 1px}
.drag-handle:hover{color:#888}
.expr-row.drag-over{border-top:2px solid var(--accent)}
.expr-row.is-header{background:#f4f5f7}
.expr-row.is-header .swatch,.expr-row.is-header .opt-btn,.expr-row.is-header .dup-btn{display:none}
.expr-row.is-header .expr-formula{font-weight:700;cursor:pointer}
.header-caret{color:var(--muted);margin-right:5px;font-size:10px}
.icon-btn.active{color:var(--accent)}

/* Options panel */
.expr-opts{background:#fafafa;border-top:1px solid #f0f0f0;padding:8px 10px;display:none;gap:6px;flex-direction:column}
.expr-opts.open{display:flex}
.opt-row{display:flex;align-items:center;gap:8px;font-size:calc(var(--sb-font,13px)*0.92)}
.opt-row label{width:80px;flex-shrink:0;color:var(--muted)}
.opt-row select,.opt-row input[type=text]{font:12px inherit;border:1px solid var(--border);border-radius:4px;padding:2px 6px;background:#fff;color:var(--text)}
.opt-row input[type=range]{flex:1;accent-color:var(--accent)}
.opt-row input[type=checkbox]{accent-color:var(--accent)}
.opt-val{font-size:11px;color:var(--muted);width:32px;text-align:right}

/* Parameter sliders */
#params-panel{border-top:1px solid var(--border);padding:0}
.param-row{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid #f0f0f0}
.param-label{font-size:calc(var(--sb-font,13px)*0.92);font-weight:600;width:28px;flex-shrink:0}
.param-slider{flex:1;accent-color:var(--accent)}
.param-val{font-size:calc(var(--sb-font,13px)*0.88);color:var(--muted);width:44px;text-align:right;font-family:monospace}
.param-anim{font-size:11px;cursor:pointer;color:var(--muted);padding:2px 4px}
.param-anim:hover,.param-anim.active{color:var(--accent)}

/* Bottom bar */
#bottom-bar{padding:8px 10px;border-top:1px solid var(--border);display:flex;gap:6px}
#bottom-bar button{flex:1;font:13px "Helvetica Neue",Arial,sans-serif;padding:7px;border-radius:6px;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text)}
#bottom-bar button:hover{background:#eee}
#btn-add{border-color:var(--accent)!important;color:var(--accent)!important}
#btn-add:hover{background:#eff6ff!important}

/* ── Canvas ──────────────────────────────────────────────────── */
#resize-handle{width:5px;background:transparent;cursor:col-resize;flex-shrink:0;position:relative;z-index:10;transition:background .15s}
#resize-handle:hover,#resize-handle.dragging{background:var(--accent)}

/* 2D+3D split (Велик-1) */
#pane2d-wrap{display:none;flex:0 0 38%;position:relative;background:#fff;overflow:hidden;min-width:120px}
#pane2d{position:absolute;inset:0}
#pane2d-label{position:absolute;top:8px;left:10px;z-index:4;font:11px monospace;color:var(--muted);background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:5px;padding:3px 7px;display:flex;align-items:center;gap:4px}
.axis-btn{width:20px;height:20px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;font:11px monospace;color:var(--muted);padding:0;line-height:1}
.axis-btn:hover{background:#f0f0f0}
.axis-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
#slice-val{width:38px;border:1px solid var(--border);border-radius:4px;font:11px monospace;padding:1px 3px;text-align:center;color:var(--text)}
#split-divider{display:none;width:5px;background:var(--border);cursor:col-resize;flex-shrink:0}
#split-divider:hover{background:var(--accent)}
/* Зум-кнопки 2D-движка (стилі живуть у хост-сторінці) */
.gc-zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px;z-index:4}
.gc-zb{width:28px;height:28px;border:1px solid var(--border);border-radius:6px;background:rgba(255,255,255,.9);cursor:pointer;font-size:14px;color:#444;line-height:1}
.gc-zb:hover{background:#f0f0f0}
#app.split #pane2d-wrap{display:block}
#app.split #split-divider{display:block}

/* Camera toolbar */
#canvas-wrap{flex:1;position:relative;overflow:hidden}
#cam-bar{position:absolute;top:10px;left:10px;display:flex;gap:5px;z-index:5}
#fps-badge{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.8);border:1px solid var(--border);border-radius:5px;padding:3px 8px;font:11px monospace;color:var(--muted);pointer-events:none;backdrop-filter:blur(4px);z-index:5}

/* Export dropdown */
.dropdown{position:relative}
.dropdown-menu{display:none;position:absolute;top:calc(100%+4px);right:0;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.1);min-width:120px;z-index:20;overflow:hidden}
.dropdown-menu.open{display:block}
.dropdown-menu button{display:block;width:100%;text-align:left;padding:7px 12px;font:12px "Helvetica Neue",Arial,sans-serif;border:none;background:none;cursor:pointer;color:var(--text)}
.dropdown-menu button:hover{background:#f0f0f0}

/* ── Gallery ─────────────────────────────────────────────────── */
#gallery-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100}
#gallery-overlay.open{display:flex}
#gallery-box{background:#fff;border-radius:12px;padding:20px;width:min(820px,95vw);max-height:88vh;display:flex;flex-direction:column;gap:12px}
#gallery-header{display:flex;align-items:center;gap:10px}
#gallery-header h2{font-size:15px;font-weight:700;flex:1}
.gallery-cats{display:flex;gap:6px;flex-wrap:wrap}
.gcat-btn{padding:4px 10px;border-radius:12px;border:1px solid var(--border);background:#fff;font:12px inherit;cursor:pointer;color:var(--muted)}
.gcat-btn.active,.gcat-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
#gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;overflow-y:auto;max-height:60vh}
.g-item{border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;transition:background .1s,border-color .1s}
.g-item:hover{background:#f0f7ff;border-color:var(--accent)}
.g-item h3{font-size:12px;font-weight:600;margin-bottom:3px}
.g-item p{font-size:10.5px;color:var(--muted);font-family:monospace;word-break:break-all}
#gallery-search{flex:1;border:1px solid var(--border);border-radius:6px;padding:5px 10px;font:13px inherit;outline:none}
#gallery-search:focus{border-color:var(--accent)}
.g-thumb{width:100%;height:70px;background:#f0f0f0;border-radius:5px;overflow:hidden;margin-bottom:6px;display:flex;align-items:center;justify-content:center}
.g-thumb canvas{display:block;width:100%;height:100%}
.g-thumb-empty{font-size:22px;color:#ddd}
.tag-surface{background:#dbeafe;color:#1d4ed8}
.tag-curve{background:#d1fae5;color:#065f46}
.tag-param-surface{background:#ede9fe;color:#5b21b6}
.tag-special{background:#fef3c7;color:#92400e}

/* ── Autorotate speed popup ───────────────────────────────────────── */
#autorot-popup{position:absolute;top:46px;left:10px;background:rgba(255,255,255,.95);
  border:1px solid var(--border);border-radius:8px;padding:10px 14px;z-index:10;
  display:none;gap:8px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.1);
  backdrop-filter:blur(4px);font-size:12px;min-width:200px}
#autorot-popup.open{display:flex}
#autorot-popup label{color:var(--muted);white-space:nowrap}
#autorot-speed{flex:1;accent-color:var(--accent)}
#autorot-val{font:11.5px monospace;color:var(--text);min-width:28px;text-align:right}
/* ── Clip panel ─────────────────────────────────────────────── */
#clip-panel{position:absolute;top:46px;left:10px;background:rgba(255,255,255,.95);
  border:1px solid var(--border);border-radius:8px;padding:10px 12px;z-index:10;
  display:none;gap:8px;flex-direction:column;min-width:220px;
  box-shadow:0 4px 14px rgba(0,0,0,.1);backdrop-filter:blur(4px)}
#clip-panel.open{display:flex}
.clip-label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.clip-axes{display:flex;gap:5px}
.clip-ax{padding:3px 10px;border-radius:5px;border:1px solid var(--border);
  background:#fff;font:12px inherit;cursor:pointer;color:var(--muted)}
.clip-ax.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.clip-row{display:flex;align-items:center;gap:8px;font-size:12px}
.clip-row label{color:var(--muted);min-width:14px}
.clip-row input[type=range]{flex:1;accent-color:var(--accent)}
.clip-row .clip-num{font:11.5px monospace;color:var(--text);min-width:38px;text-align:right}
.clip-check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
.clip-check input{accent-color:var(--accent)}
#mylib-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100}
#mylib-overlay.open{display:flex}
#mylib-box{background:#fff;border-radius:12px;padding:18px;width:min(560px,92vw);max-height:80vh;display:flex;flex-direction:column;gap:12px}
#mylib-header{display:flex;align-items:center;gap:8px}
#mylib-header h2{font-size:15px;font-weight:700;flex:1;margin:0}
#mylib-list{overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.mylib-item{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:9px 12px;cursor:pointer}
.mylib-item:hover{background:#f0f7ff;border-color:var(--accent)}
.mylib-name{flex:1;font-weight:600;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mylib-name input{font:inherit;border:1px solid var(--accent);border-radius:4px;padding:1px 5px;width:100%}
.mylib-meta{font-size:11px;color:var(--muted);font-family:monospace;flex-shrink:0}
.mylib-act{background:none;border:none;cursor:pointer;color:#bbb;font-size:13px;padding:2px 5px;flex-shrink:0}
.mylib-act:hover{color:var(--text)}
.mylib-empty{text-align:center;color:var(--muted);font-size:13px;padding:24px 0}
#cp{position:fixed;background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px;display:none;z-index:200;gap:5px;flex-wrap:wrap;width:128px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
#cp.open{display:flex}
.cp-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid rgba(0,0,0,.1);transition:transform .1s}
.cp-dot:hover{transform:scale(1.2);border-color:rgba(0,0,0,.3)}
#rec-dot{position:absolute;bottom:12px;left:12px;z-index:6;display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.9);border:1px solid var(--red);color:var(--red);border-radius:6px;
  padding:4px 10px;font:600 12px "Helvetica Neue",Arial,sans-serif;cursor:pointer}
#rec-dot span{width:9px;height:9px;border-radius:50%;background:var(--red);animation:recblink 1s infinite}
@keyframes recblink{50%{opacity:.25}}

/* ── Мобільний layout (Велик-3) ─────────────────────────────────────── */
@media (max-width: 700px), (pointer: coarse) and (max-width: 900px) {
  #app{flex-direction:column}
  #sidebar{order:2;width:100%!important;flex:0 0 42%;border-right:none;border-top:1px solid var(--border)}
  #resize-handle{display:none}
  #split-divider{display:none!important}
  #app.split #pane2d-wrap{flex:0 0 30%;min-height:120px}
  #pane2d-wrap{order:1}
  #canvas-wrap{order:0;min-height:0}
  .tb-btn{padding:9px 12px;font-size:13px}
  .icon-btn{width:32px;height:32px;font-size:16px}
  .swatch{width:22px;height:22px}
  .param-slider{height:28px}
  #cam-bar{flex-wrap:wrap;max-width:calc(100% - 20px)}
  .expr-row{padding:8px 8px 8px 10px}
  #bottom-bar button{padding:11px}
}
</style>
</head>

const GALLERY = [

  {cat:'surface', title:'Конус ⅓',          src:'z=(x^2+y^2)^(1/3)'},
  {cat:'surface', title:'Висока частота',    src:'z=sin(5*x)*sin(5*y)/5'},
  {cat:'surface', title:'Monkey saddle',     src:'z=x^3-3*x*y^2'},
  {cat:'surface', title:'Cos від радіуса',   src:'z=cos(sqrt(x^2+y^2))'},
  {cat:'surface', title:'Абс-пірамід',      src:'z=abs(x)+abs(y)'},
  // ── Parametric curves ──
  {cat:'curve', title:'Гвинтова лінія',     src:'(cos(t),sin(t),t/4)'},

  {cat:'curve', title:'Квітка Lissajous',   src:'(sin(t)*cos(5*t),sin(t)*sin(5*t),cos(t))'},

// ── Undo/Redo (Полір-2): снапшоти Scene v2 ─────────────────────────────────────
const _undoStack = [], _redoStack = [];
let _undoApplying = false, _undoTimer = null;
function pushUndoSoon() {
  if (_undoApplying) return;
  clearTimeout(_undoTimer);
  _undoTimer = setTimeout(() => {
    try {
      const st = collectState();
      delete st.camera; // undo стосується контенту, не ракурсу
      const snap = JSON.stringify(st);
      if (_undoStack.length && _undoStack[_undoStack.length - 1] === snap) return;
      _undoStack.push(snap);
      if (_undoStack.length > 100) _undoStack.shift();
      _redoStack.length = 0;
      updateUndoBtns();
    } catch(_) {}
  }, 350);
}
function restoreSnap(json) {
  _undoApplying = true;
  try {
    applyState(JSON.parse(json));
    renderRows(); renderParams(); saveStateSoon();
  } finally { _undoApplying = false; }
  updateUndoBtns();
}
function doUndo() {
  if (_undoStack.length < 2) return;
  _redoStack.push(_undoStack.pop());
  restoreSnap(_undoStack[_undoStack.length - 1]);
}
function doRedo() {
  if (!_redoStack.length) return;
  const s = _redoStack.pop();
  _undoStack.push(s);
  restoreSnap(s);
}
function updateUndoBtns() {
  document.getElementById('btn-undo').disabled = _undoStack.length < 2;
  document.getElementById('btn-redo').disabled = !_redoStack.length;
}
document.getElementById('btn-undo').onclick = doUndo;
document.getElementById('btn-redo').onclick = doRedo;
document.addEventListener('keydown', e => {
  const scope = window.__mashKeydownScope;
  if (scope && e.target instanceof Node && !scope.contains(e.target)) return; // guard для вбудовування (§2.2)
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return; // нативний undo у полях
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    if (e.shiftKey) doRedo(); else doUndo();
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
    e.preventDefault(); doRedo();
  }
});

calc.onChange = (e) => {
  if (e.reason === 'animate' || e.reason === 'animend') { syncParamValues(); sync2DParams(); return; }
  if (e.reason === 'param') { syncParamValues(); saveStateSoon(); sync2DParams(); return; }
  if (e.reason === 'expression') { pushUndoSoon(); sync2DSoon(); }
  renderRows(); renderParams(); saveStateSoon();
};

// ── Greek auto-replace: pi→π, theta→θ, phi→φ, rho→ρ, tau→τ ─────────────────────
function greekify(inp) {
  const old = inp.value;
  let v = old;
  [['pi','π'],['theta','θ'],['phi','φ'],['rho','ρ'],['tau','τ']].forEach(([w, g]) => {
    v = v.replace(new RegExp('(^|[^a-zA-Zα-ωθφρπτ0-9_])' + w + '(?![a-zA-Z0-9_])', 'g'), '$1' + g);
  });
  if (v !== old) {
    const caret = (inp.selectionStart || 0) - (old.length - v.length);
    inp.value = v;
    try { inp.setSelectionRange(caret, caret); } catch(_) {}
  }
}

// ── Formula renderer
function renderFormula(src, el) {
  if (!src || !src.trim()) {
    el.innerHTML = '<span class="expr-formula-empty">' + ((window.MashI18n && MashI18n.ready && MashI18n.t('mash.g3d.expr.empty') !== 'mash.g3d.expr.empty') ? MashI18n.t('mash.g3d.expr.empty') : 'введи вираз…') + '</span>';
    return;
  }
  try {
    const latex = window.exprToLatex ? window.exprToLatex(src) : src;
    window.katex.render(latex, el, { throwOnError: false, displayMode: false, strict: false });
  } catch (_) {
    el.textContent = src;
  }
}

// ── Render rows ───────────────────────────────────────────────────────────────
const exprScroll = document.getElementById('expr-scroll');
let _debounce = {};

function renderRows() {
  while (exprScroll.children.length > calc.expressions.length) exprScroll.lastChild.remove();
  while (exprScroll.children.length < calc.expressions.length) exprScroll.appendChild(makeRow());
  let hideUnder = false;
  calc.expressions.forEach((e, i) => {
    const row = exprScroll.children[i];
    row.dataset.id = e.id;
    const c = e.classified;
    const isHeader = c?.kind === 'header';
    row.classList.toggle('is-header', isHeader);
    row.style.display = (!isHeader && hideUnder) ? 'none' : '';
    if (isHeader) hideUnder = !!e.collapsed;
    const sw = row.querySelector('.swatch'); sw.style.background = e.color;
    sw.onclick = ev => { ev.stopPropagation(); openCP(e.id, sw); };
    const inp = row.querySelector('.expr-input');
    inp.value = e.src; // always sync — never rely on placeholder
    // Sync formula display (only if not currently editing)
    const fml = row.querySelector('.expr-formula');
    if (inp.style.display === 'none' || !inp.style.display) {
      if (isHeader) {
        fml.innerHTML = '<span class="header-caret">' + (e.collapsed ? '▸' : '▾') + '</span>' +
          '<b></b>';
        fml.querySelector('b').textContent = c.text || 'Група';
      } else {
        renderFormula(e.src, fml);
      }
    }
    const errEl = row.querySelector('.expr-err');
    if (c?.kind === 'invalid') { errEl.textContent = c.error || 'Помилка'; errEl.classList.add('show'); }
    else errEl.classList.remove('show');
    // vis button: для заголовка — згортання групи
    const visBtn = row.querySelector('.vis-btn');
    if (isHeader) {
      visBtn.textContent = e.collapsed ? '▸' : '▾';
      visBtn.classList.add('active');
      visBtn.title = e.collapsed ? 'Розгорнути групу' : 'Згорнути групу';
    } else {
      visBtn.textContent = e.visible ? '👁' : '👁‍🗨';
      visBtn.classList.toggle('active', e.visible);
      visBtn.title = 'Видимість';
    }
    // options
    syncOpts(row, e);
  });
}

  div.querySelector('.rem-btn').onclick = () => { calc.removeExpression(+div.dataset.id); renderRows(); renderParams(); };

  // Drag-перестановка

  div.addEventListener('drop', ev => {

    const srcId = +ev.dataTransfer.getData('text/g3d-id');

  // Option controls
  const bindChange = (sel, fn) => div.querySelector(sel).addEventListener('change', () => fn(+div.dataset.id, div));

  bindInput('.opt-res',  (id, d) => { const v=+d.querySelector('.opt-res').value; d.querySelectorAll('.opt-val')[2].textContent=v; calc.setResolution(id,v); });
  const applyTRange = (id, d) => {

    const v0=parseFloat(d.querySelector('.opt-vmin').value), v1=parseFloat(d.querySelector('.opt-vmax').value);

  };
  ['.opt-tmin','.opt-tmax'].forEach(s => div.querySelector(s).addEventListener('change', (_, d2=div) => applyTRange(+div.dataset.id, div)));
  ['.opt-umin','.opt-umax','.opt-vmin','.opt-vmax'].forEach(s => div.querySelector(s).addEventListener('change', () => applyUVRange(+div.dataset.id, div)));
  return div;
}

function syncOpts(row, expr) {

  row.querySelector('.opt-cm').value = expr.colorMap || 'solid';

  if (expr.uRange) { row.querySelector('.opt-umin').value = expr.uRange[0]; row.querySelector('.opt-umax').value = expr.uRange[1]; }
  if (expr.vRange) { row.querySelector('.opt-vmin').value = expr.vRange[0]; row.querySelector('.opt-vmax').value = expr.vRange[1]; }

}

// ── Parameter sliders ─────────────────────────────────────────────────────────
const paramsPanel = document.getElementById('params-panel');
function getAutoParams() {
  // Detect free variables in non-param expressions that aren't spatial vars
  const SPATIAL = new Set(['x','y','z','t','u','v','s','r','rho','theta','phi','θ','φ','ρ','π','τ','e','pi','tau','inf']);
  const knownParams = new Set(calc.expressions.filter(e=>e.classified?.kind==='param').map(e=>e.classified.name));
  const GC = window.GraphCalc;
  const freeSet = new Set();
  calc.expressions.forEach(e => {
    const c = e.classified;
    if (!c || ['param','funcDef3D','invalid'].includes(c.kind)) return;
    const asts = [];
    if (c.ast)    asts.push(c.ast);
    if (c.lhsAst) asts.push(c.lhsAst);
    if (c.rhsAst) asts.push(c.rhsAst);
    if (c.xAst)   asts.push(c.xAst, c.yAst, c.zAst);
    if (c.args)   c.args.forEach(a => asts.push(a));
    asts.forEach(ast => { try { GC.freeVars(ast).forEach(v => freeSet.add(v)); } catch(_){} });
  });
  // Remove spatial, known params, consts
  const consts = new Set(Object.keys(GC.CONSTS||{}));
  return [...freeSet].filter(v => !SPATIAL.has(v) && !knownParams.has(v) && !consts.has(v));
}

// Parse "pi", "2pi", "-pi/2", numbers — anything GraphCalc understands
function parseMathNum(str) {
  if (typeof str === 'number') return str;
  const s = String(str).trim();
  if (!s) return NaN;
  try {
    const GC = window.GraphCalc;
    const v = GC.evalAst(GC.parse(s), { ...GC.CONSTS });
    return Number.isFinite(v) ? v : NaN;
  } catch(_) { return NaN; }
}
// Format numbers: show "π"-multiples nicely
function fmtMathNum(v) {
  const PI = Math.PI;
  for (const [mult, label] of [[2*PI,'2π'],[PI,'π'],[PI/2,'π/2'],[PI/4,'π/4']]) {
    if (Math.abs(v - mult) < 1e-9) return label;
    if (Math.abs(v + mult) < 1e-9) return '-'+label;
  }
  return Number.isInteger(v) ? String(v) : (+v.toFixed(3)).toString();
}

// Persistent per-param ranges — survive re-renders
const _paramRanges = {};
function getParamRange(name) {
  if (!_paramRanges[name]) _paramRanges[name] = { minStr: '-5', maxStr: '5', mode: 'pingpong', speedMul: 1 };
  return _paramRanges[name];
}
const ANIM_MODES  = ['pingpong', 'loop', 'once'];
const MODE_ICON   = { pingpong: '⇄', loop: '⟳', once: '→' };
const MODE_TITLE  = { pingpong: 'Туди-назад', loop: 'По колу', once: 'Один раз' };
const SPEED_MULS  = [0.25, 0.5, 1, 2, 4];

function renderParams() {
  const paramExprs = calc.expressions.filter(e => e.classified?.kind === 'param');
  const autoParams = getAutoParams();
  if (paramExprs.length === 0 && autoParams.length === 0) { paramsPanel.innerHTML = ''; return; }
  autoParams.forEach(name => { if (calc.params[name] === undefined) calc.params[name] = 0; });
  const allParams = [...paramExprs.map(e => e.classified.name), ...autoParams];

  paramsPanel.innerHTML = allParams.map(name => {
    const v = (calc.params[name] ?? 0);
    const anim = !!calc._animParams[name];
    const r = getParamRange(name);
    const mn = parseMathNum(r.minStr), mx = parseMathNum(r.maxStr);
    return `<div class="param-row" data-param="${name}">
      <button class="param-anim${anim?' active':''}" title="${anim?'Зупинити':'Анімувати'}" style="font-size:13px;flex-shrink:0;background:none;border:none;cursor:pointer;color:${anim?'var(--accent)':'#999'};padding:2px 4px">${anim?'⏸':'▶'}</button>
      <span class="param-label" style="font-style:italic;flex-shrink:0">${name}</span>
      <span class="param-val" style="flex-shrink:0">${v.toFixed(2)}</span>
      <input type="text" class="param-min" value="${r.minStr}" title="мін (можна pi, 2pi)" style="width:34px;flex-shrink:0;border:1px solid #ddd;border-radius:3px;font:10px monospace;padding:1px 2px;text-align:center">
      <input type="range" class="param-slider" min="${mn}" max="${mx}" step="${(mx-mn)/500}" value="${v}" style="flex:1;min-width:40px">
      <input type="text" class="param-max" value="${r.maxStr}" title="макс (можна pi, 2pi)" style="width:34px;flex-shrink:0;border:1px solid #ddd;border-radius:3px;font:10px monospace;padding:1px 2px;text-align:center">
      <button class="param-mode" title="Режим: ${MODE_TITLE[r.mode]}" style="flex-shrink:0;background:none;border:1px solid #ddd;border-radius:3px;cursor:pointer;color:#777;font-size:11px;padding:1px 4px;min-width:22px">${MODE_ICON[r.mode]}</button>
      <button class="param-speed" title="Швидкість" style="flex-shrink:0;background:none;border:1px solid #ddd;border-radius:3px;cursor:pointer;color:#777;font:9.5px monospace;padding:1px 3px;min-width:24px">${r.speedMul}×</button>
    </div>`;
  }).join('') + (autoParams.length ? '<div style="font-size:10px;color:#bbb;padding:2px 12px 4px;border-top:1px solid #f0f0f0">↑ виявлені змінні</div>' : '');

  paramsPanel.querySelectorAll('.param-row').forEach(row => {
    const name    = row.dataset.param;
    const sl      = row.querySelector('.param-slider');
    const valEl   = row.querySelector('.param-val');
    const animBtn = row.querySelector('.param-anim');
    const minIn   = row.querySelector('.param-min');
    const maxIn   = row.querySelector('.param-max');

    const applyRange = () => {
      const r = getParamRange(name);
      r.minStr = minIn.value; r.maxStr = maxIn.value;
      const mn = parseMathNum(r.minStr), mx = parseMathNum(r.maxStr);
      if (!Number.isFinite(mn) || !Number.isFinite(mx) || mn >= mx) {
        minIn.style.borderColor = maxIn.style.borderColor = 'var(--red)';
        return;
      }
      minIn.style.borderColor = maxIn.style.borderColor = '#ddd';
      sl.min = mn; sl.max = mx; sl.step = (mx - mn) / 500;
      // If animation running — update its bounds live
      if (calc._animParams[name]) {
        calc._animParams[name].min = mn;
        calc._animParams[name].max = mx;
      }
    };
    minIn.addEventListener('change', applyRange);
    maxIn.addEventListener('change', applyRange);
    minIn.addEventListener('keydown', e => { if (e.key === 'Enter') minIn.blur(); });
    maxIn.addEventListener('keydown', e => { if (e.key === 'Enter') maxIn.blur(); });

    sl.addEventListener('input', () => {
      const v = +sl.value;
      valEl.textContent = v.toFixed(2);
      calc.setParam(name, v);   // onChange 'param' → syncParamValues (no rebuild)
    });

    const modeBtn  = row.querySelector('.param-mode');
    const speedBtn = row.querySelector('.param-speed');
    const baseSpeed = () => {
      const mn = parseMathNum(minIn.value), mx = parseMathNum(maxIn.value);
      return (mx - mn) / 8 * getParamRange(name).speedMul;
    };
    modeBtn.addEventListener('click', () => {
      const r = getParamRange(name);
      r.mode = ANIM_MODES[(ANIM_MODES.indexOf(r.mode) + 1) % ANIM_MODES.length];
      modeBtn.textContent = MODE_ICON[r.mode];
      modeBtn.title = 'Режим: ' + MODE_TITLE[r.mode];
      calc.setAnimationOpts(name, { mode: r.mode });
    });
    speedBtn.addEventListener('click', () => {
      const r = getParamRange(name);
      r.speedMul = SPEED_MULS[(SPEED_MULS.indexOf(r.speedMul) + 1) % SPEED_MULS.length];
      speedBtn.textContent = r.speedMul + '×';
      calc.setAnimationOpts(name, { speed: baseSpeed() });
    });
    animBtn.addEventListener('click', () => {
      if (calc._animParams[name]) {
        calc.stopAnimation(name);
        animBtn.classList.remove('active');
        animBtn.textContent = '▶';
        animBtn.style.color = '#999';
      } else {
        const mn = parseMathNum(minIn.value), mx = parseMathNum(maxIn.value);
        if (!Number.isFinite(mn) || !Number.isFinite(mx) || mn >= mx) return;
        calc.startAnimation(name, { min: mn, max: mx, speed: baseSpeed(), mode: getParamRange(name).mode });
        animBtn.classList.add('active');
        animBtn.textContent = '⏸';
        animBtn.style.color = 'var(--accent)';
      }
    });
  });
}

// In-place update of slider positions/values — NO innerHTML rebuild
function syncParamValues() {
  paramsPanel.querySelectorAll('.param-row').forEach(row => {
    const name = row.dataset.param;
    const v = calc.params[name];
    if (v === undefined) return;
    const sl = row.querySelector('.param-slider');
    if (document.activeElement !== sl) sl.value = v;

    if (btn && btn.classList.contains('active') !== running) {
      btn.classList.toggle('active', running);
      btn.textContent = running ? '⏸' : '▶';
      btn.style.color = running ? 'var(--accent)' : '#999';
    }
  });
}

// ── 2D+3D split (Велик-1): 2D-панель у головному застосунку ────────────────────
let calc2d = null, _splitOn = false, _splitRatio = 0.38;
let _2dAdded = [], _sync2dT = null, _2dParamIds = {}, _2dpLast = 0, _2dpTrail = null;

// Переріз за замовчуванням — керується перемикачем x/y/z над 2D-панеллю.
// Якщо у сцені є slice(...)-об'єкт, він має пріоритет.
let _defaultSlice = { axis: 'y', val: 0 };
function activeSlice2D() {
  const s = calc.getActiveSlice && calc.getActiveSlice();
  return s ? { axis: s.axis, val: s.value, fromScene: true } : { ..._defaultSlice };
}

// Перемикач осі перерізу
document.querySelectorAll('.axis-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    _defaultSlice.axis = btn.dataset.axis;
    document.querySelectorAll('.axis-btn').forEach(b =>
      b.classList.toggle('active', b === btn));
    sync2D();
    saveStateSoon();
  });
});
document.getElementById('slice-val').addEventListener('change', function() {
  const v = parseMathNum(this.value);
  if (!Number.isFinite(v)) { this.style.borderColor = 'var(--red)'; return; }
  this.style.borderColor = 'var(--border)';
  _defaultSlice.val = v;
  sync2D();
  saveStateSoon();
});
document.getElementById('slice-val').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') this.blur();
});

// z=f(x,y) → 2D-вираз за активним перерізом
function sliceSrc2D(src, sl) {
  const s = src.trim();
  let eqPos = -1;
  for (let i = 1; i < s.length; i++) {
    if (s[i] === '=' && !['<','>','!','='].includes(s[i-1]) && s[i+1] !== '=') { eqPos = i; break; }
  }
  if (eqPos < 0 || s.slice(0, eqPos).trim() !== 'z') return null;
  let rhs = s.slice(eqPos + 1);
  const vs = '(' + (+sl.val.toFixed(4)) + ')';
  if (sl.axis === 'y') return 'y = ' + rhs.replace(/\by\b/g, vs);
  if (sl.axis === 'x') return 'y = ' + rhs.replace(/\bx\b/g, vs).replace(/\by\b/g, 'x');
  return rhs + ' = ' + (+sl.val.toFixed(4));
}

function derive2D(e, sl) {
  const c = e.classified;
  if (!c || e.visible === false) return null;
  if (c.kind === 'param' || c.kind === 'funcDef3D') return e.src;
  if (c.kind === 'surfaceZ') return sliceSrc2D(e.src, sl);
  // Неявні без z (y=f(x), кола x^2+y^2=r) — рідні 2D-вирази
  if (c.kind === 'implicit3D' && !/\bz\b/.test(e.src) && !e.src.trim().startsWith('levelset')) return e.src;
  return null;
}

function sync2D() {
  if (!_splitOn || !calc2d) return;
  _2dAdded.forEach(id => { try { calc2d.removeExpression(id); } catch(_) {} });
  _2dAdded = [];
  const sl = activeSlice2D();
  document.querySelectorAll('.axis-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.axis === sl.axis));
  const svEl = document.getElementById('slice-val');
  if (document.activeElement !== svEl && sl.fromScene) svEl.value = (+sl.val.toFixed(2));
  // Параметри спершу — як вирази, щоб 2D-движок їх знав до класифікації похідних
  _2dParamIds = {};
  Object.entries(calc.params).forEach(([n, v]) => {
    if (!Number.isFinite(v)) return;
    try {
      const pe = calc2d.addExpression(n + ' = ' + (+v.toFixed(6)));
      _2dAdded.push(pe.id);
      _2dParamIds[n] = pe.id;
    } catch(_) {}
  });
  calc.expressions.forEach(e => {
    const src2 = derive2D(e, sl);
    if (!src2) return;
    if (e.classified?.kind === 'param') return; // вже додані вище
    try {
      const e2 = calc2d.addExpression(src2);
      _2dAdded.push(e2.id);
      try { calc2d.setColor(e2.id, e.color); } catch(_) {}
    } catch(_) {}
  });
  try { calc2d.draw && calc2d.draw(); } catch(_) {}
}

function sync2DSoon() {
  if (!_splitOn) return;
  clearTimeout(_sync2dT);
  _sync2dT = setTimeout(sync2D, 120);
}

// Живе оновлення значень параметрів у 2D (анімація/слайдер) — throttle 100мс
function sync2DParams() {
  if (!_splitOn || !calc2d) return;
  const now = performance.now();
  if (now - _2dpLast < 100) {
    clearTimeout(_2dpTrail);
    _2dpTrail = setTimeout(sync2DParams, 110);
    return;
  }
  _2dpLast = now;
  let needFull = false;
  Object.entries(calc.params).forEach(([n, v]) => {
    if (!Number.isFinite(v)) return;
    if (_2dParamIds[n] == null) { needFull = true; return; }
    try {
      // setParam планує перемальовування залежних кривих (_scheduleRender)
      if (typeof calc2d.setParam === 'function') calc2d.setParam(n, v);
      // і тримаємо src парам-виразу актуальним (для відображення)
      calc2d.updateExpression(_2dParamIds[n], n + ' = ' + (+v.toFixed(6)));
    } catch(_) { needFull = true; }
  });
  if (needFull) sync2DSoon();
}

// ── Gallery thumbnails ────────────────────────────────────────────────────────
// Strategy: one shared Three.js renderer (no DOM append needed),
// render sync → ctx.drawImage() directly — no toDataURL round-trip.
const THUMB_W = 96, THUMB_H = 72;
let _thumbR = null, _thumbScene = null, _thumbCam = null;
const _thumbCache = new Map(); // src → ImageData
const _thumbQ = [];
let _thumbRunning = false;

function _initThumbR() {
  if (_thumbR) return;
  _thumbR = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true, alpha: false });
  _thumbR.setPixelRatio(1);
  _thumbR.setSize(THUMB_W, THUMB_H);
  // NOT appended to DOM — purely offscreen
  _thumbCam = new THREE.PerspectiveCamera(50, THUMB_W / THUMB_H, 0.01, 100);
  _thumbCam.position.set(4, 2.5, 5); _thumbCam.lookAt(0, 0, 0);
  _thumbScene = new THREE.Scene();
  _thumbScene.background = new THREE.Color(0xf5f5f5);
  _thumbScene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dl = new THREE.DirectionalLight(0xffffff, 0.9);
  dl.position.set(5, 10, 7); _thumbScene.add(dl);
  _thumbScene.add(new THREE.GridHelper(6, 6, 0xcccccc, 0xe4e4e4));
}

function _enqueueThumb(item, cvEl) {
  if (_thumbCache.has(item.src)) {
    _blitThumb(cvEl, _thumbCache.get(item.src)); return;
  }
  _thumbQ.push({ item, cvEl });
  if (!_thumbRunning) _runThumbQ();
}

function _blitThumb(cvEl, imgData) {
  // cvEl may have been removed from DOM if gallery re-rendered; guard
  if (!cvEl.isConnected) return;
  cvEl.getContext('2d').putImageData(imgData, 0, 0);
}

function _runThumbQ() {
  if (!_thumbQ.length) { _thumbRunning = false; return; }
  _thumbRunning = true;
  const { item, cvEl } = _thumbQ.shift();
  // Defer each item one tick so UI stays responsive
  setTimeout(() => {
    try {
      _initThumbR();
      const imgData = _renderThumb(item);
      if (imgData) {
        _thumbCache.set(item.src, imgData);
        _blitThumb(cvEl, imgData);
      }
    } catch(e) { console.warn('[thumb]', item.src, e && e.message ? e.message : e); }
    _runThumbQ(); // next item
  }, 0);
}

function _renderThumb(item) {
  const GC = window.GraphCalc;
  // Clear previous meshes
  _thumbScene.children.filter(c => c.isMesh || c.isGroup).forEach(c => {
    _thumbScene.remove(c);
    c.geometry?.dispose();
    (Array.isArray(c.material) ? c.material : [c.material]).forEach(m => m?.dispose());
  });
  const c = classify3D(item.src);
  const col = new THREE.Color(item.color || PALETTE3D[0]);
  const ev = (ast, ex = {}) => { try { return GC.evalAst(ast, { ...GC.CONSTS, ...ex }); } catch(_) { return NaN; } };
  let obj = null;

  if (c.kind === 'surfaceZ') {
    const N = 30, rng = item.range || 3;
    const pos = [], idx = [], ok = [];
    for (let i = 0; i <= N; i++) {
      for (let j = 0; j <= N; j++) {
        const x = -rng + 2*rng*i/N, y = -rng + 2*rng*j/N;
        const z = ev(c.ast, {x, y}); const g = Number.isFinite(z) && Math.abs(z) < 500;
        ok.push(g ? 1 : 0); pos.push(x, g ? z : 0, y);
      }
    }
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
      const a=i*(N+1)+j, b=a+1, cc=a+(N+1), d=cc+1;
      if (ok[a]&&ok[b]&&ok[cc]&&ok[d]) idx.push(a,b,cc, b,d,cc);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx); g.computeVertexNormals();
    obj = new THREE.Mesh(g, new THREE.MeshPhongMaterial({ color: col, side: THREE.DoubleSide, shininess: 30 }));

  } else if (c.kind === 'curve3D') {
    const N = 150, [t0, t1] = item.tRange || [0, Math.PI*2], tv = c.tVar || 't';
    const pts = [];
    for (let i = 0; i <= N; i++) {
      const t = t0 + (t1-t0)*i/N;
      const x = ev(c.xAst,{t,[tv]:t}), y = ev(c.yAst,{t,[tv]:t}), z = ev(c.zAst,{t,[tv]:t});
      if ([x,y,z].every(v => Number.isFinite(v) && Math.abs(v) < 200))
        pts.push(new THREE.Vector3(x, z, y));
    }
    if (pts.length >= 3) {
      try {
        obj = new THREE.Mesh(
          new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 120, 0.09, 8, false),
          new THREE.MeshPhongMaterial({ color: col, shininess: 60 })
        );
      } catch(_) {}
    }

  } else if (c.kind === 'surface3D') {
    const N = 24, [u0,u1] = item.uRange||[0,Math.PI*2], [v0,v1] = item.vRange||[0,Math.PI*2];
    const pos = [], idx = [];
    for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
      const u = u0+(u1-u0)*i/N, v2 = v0+(v1-v0)*j/N;
      const x = ev(c.xAst,{u,v:v2})||0, y = ev(c.yAst,{u,v:v2})||0, z = ev(c.zAst,{u,v:v2})||0;
      pos.push(isFinite(x)?x:0, isFinite(z)?z:0, isFinite(y)?y:0);
    }
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
      const a=i*(N+1)+j, b=a+1, cc=a+(N+1), d=cc+1; idx.push(a,b,cc, b,d,cc);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx); g.computeVertexNormals();
    obj = new THREE.Mesh(g, new THREE.MeshPhongMaterial({ color: col, side: THREE.DoubleSide, shininess: 30 }));
  }

  if (!obj) return null;
  // Auto-fit
  const box = new THREE.Box3().setFromObject(obj);
  const center = box.getCenter(new THREE.Vector3());
  const size   = box.getSize(new THREE.Vector3());
  const maxD   = Math.max(size.x, size.y, size.z, 0.01);
  obj.position.sub(center); obj.scale.setScalar(2.6 / maxD);
  _thumbScene.add(obj);
  _thumbR.render(_thumbScene, _thumbCam);
  // Read pixels directly — no toDataURL, no round-trip
  const gl = _thumbR.getContext();
  const buf = new Uint8ClampedArray(THUMB_W * THUMB_H * 4);
  gl.readPixels(0, 0, THUMB_W, THUMB_H, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  // WebGL Y is flipped — flip rows
  const flipped = new Uint8ClampedArray(THUMB_W * THUMB_H * 4);
  for (let row = 0; row < THUMB_H; row++) {
    const src = (THUMB_H - 1 - row) * THUMB_W * 4;
    flipped.set(buf.subarray(src, src + THUMB_W * 4), row * THUMB_W * 4);
  }
  _thumbScene.remove(obj); obj.geometry.dispose(); obj.material.dispose();
  return new ImageData(flipped, THUMB_W, THUMB_H);
}

const MYLIB_KEY = 'mash:g3d:mylib';
const MYLIB_KEY_OLD = 'g3d-mylib';
function libRead() {
  try { return JSON.parse(localStorage.getItem(MYLIB_KEY) || localStorage.getItem(MYLIB_KEY_OLD)) || []; } catch(_) { return []; }
}
function libWrite(list) {
  try { localStorage.setItem(MYLIB_KEY, JSON.stringify(list)); } catch(e) {
    alert('Не вдалося зберегти — сховище переповнене');
  }
}
function libSummary(st) {
  const n = (st.objects || []).filter(o => !String(o.src).trim().startsWith('#')).length;
  return n + ' вираз' + (n === 1 ? '' : n < 5 ? 'и' : 'ів');
}
function renderMyLib() {
  const list = libRead();
  const box = document.getElementById('mylib-list');
  if (!list.length) {
    box.innerHTML = '<div class="mylib-empty">Порожньо. Натисніть «Зберегти поточну сцену».</div>';
    return;
  }
  box.innerHTML = '';
  list.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'mylib-item';
    const name = document.createElement('div');
    name.className = 'mylib-name';
    name.textContent = item.name;
    const meta = document.createElement('div');
    meta.className = 'mylib-meta';
    meta.textContent = libSummary(item.scene) + ' · ' +
      new Date(item.saved).toLocaleDateString('uk-UA', { day:'numeric', month:'short' });
    const ren = document.createElement('button');
    ren.className = 'mylib-act'; ren.textContent = '✎'; ren.title = 'Перейменувати';
    ren.onclick = (e) => {
      e.stopPropagation();
      const inp = document.createElement('input');
      inp.value = item.name;
      name.textContent = ''; name.appendChild(inp); inp.focus(); inp.select();
      const commit = () => {
        item.name = inp.value.trim() || item.name;
        libWrite(list); renderMyLib();
      };
      inp.onblur = commit;
      inp.onkeydown = ev => { if (ev.key === 'Enter') inp.blur(); ev.stopPropagation(); };
    };
    const del = document.createElement('button');
    del.className = 'mylib-act'; del.textContent = '✕'; del.title = 'Видалити';
    del.onclick = (e) => {
      e.stopPropagation();
      list.splice(i, 1); libWrite(list); renderMyLib();
    };
    row.appendChild(name); row.appendChild(meta); row.appendChild(ren); row.appendChild(del);
    row.onclick = () => {
      applyState(item.scene);
      renderRows(); renderParams(); saveStateSoon();
      document.getElementById('mylib-overlay').classList.remove('open');
    };
    box.appendChild(row);
  });
}

};
document.getElementById('mylib-close').onclick = () =>
  document.getElementById('mylib-overlay').classList.remove('open');
document.getElementById('mylib-overlay').onclick = e => {
  if (e.target.id === 'mylib-overlay') e.target.classList.remove('open');
};
document.getElementById('mylib-save').onclick = () => {
  const list = libRead();
  const st = collectState();
  const firstSrc = (st.objects.find(o => !String(o.src).trim().startsWith('#')) || {}).src || 'Сцена';
  list.unshift({
    name: firstSrc.length > 34 ? firstSrc.slice(0, 34) + '…' : firstSrc,
    saved: Date.now(),
    scene: st,
  });
  if (list.length > 50) list.pop();
  libWrite(list);
  renderMyLib();
};

// ── Defaults ──────────────────────────────────────────────────────────────────
// ── State persistence + sharing — GraphMASHScene v2 (SSOT BLOCK 4) ───────────
function collectState() {
  const eng = calc.getState(); // engine-level v1 snapshot
  const params = {};
  Object.keys(calc.params).forEach(n => {
    const r = getParamRange(n);
    params[n] = {
      value: calc.params[n],
      min: r.minStr, max: r.maxStr,
      anim: { on: !!calc._animParams[n], mode: r.mode || 'pingpong', speed: r.speedMul || 1 },
    };
  });
  const sbFont = document.getElementById('sidebar').style.getPropertyValue('--sb-font');
  return {
    format: 'graphmash-scene',
    version: 2,
    meta: { app: 'graphmash-3d/0.5' },
    objects: eng.expressions.map((e, i) => ({
      id: 'e' + (i + 1), src: e.src, color: e.color,
      visible: e.visible !== false, locked: false, order: i,
      collapsed: !!calc.expressions[i]?.collapsed,
      style:  { colorMap: e.colorMap || 'solid', wireframe: !!e.wireframe, opacity: e.opacity ?? 1 },
      domain: { range: e.range || null, resolution: e.resolution || null,
                tRange: e.tRange || null, uRange: e.uRange || null, vRange: e.vRange || null },
    })),
    params,
    camera: calc.getCameraState(),
    views: _camViews,
    display: { sidebarFont: sbFont ? parseFloat(sbFont) : 13,
               slice2d: { axis: _defaultSlice.axis, val: _defaultSlice.val } },
    layout: { mode: _splitOn ? 'split' : '3d', splitRatio: +_splitRatio.toFixed(3) },
  };
}

// v1 (legacy engine snapshot + flat params/paramRanges) → v2
function migrateV1(st) {
  if (st && st.format === 'graphmash-scene' && st.version === 2) return st;
  const pr = st.paramRanges || {};
  const params = {};
  Object.entries(st.params || {}).forEach(([n, v]) => {
    params[n] = { value: v, min: pr[n]?.minStr ?? '-5', max: pr[n]?.maxStr ?? '5',
      anim: { on: false, mode: pr[n]?.mode || 'pingpong', speed: pr[n]?.speedMul || 1 } };
  });
  return {
    format: 'graphmash-scene', version: 2, meta: { app: 'graphmash-3d/0.5' },
    objects: (st.expressions || []).map((e, i) => ({
      id: 'e' + (i + 1), src: e.src, color: e.color,
      visible: e.visible !== false, locked: false, order: i,
      style:  { colorMap: e.colorMap || 'solid', wireframe: !!e.wireframe, opacity: e.opacity ?? 1 },
      domain: { range: e.range || null, resolution: e.resolution || null,
                tRange: e.tRange || null, uRange: e.uRange || null, vRange: e.vRange || null },
    })),
    params, camera: null, display: {}, layout: { mode: '3d' },
  };
}

function applyState(raw) {
  const st = migrateV1(raw);
  calc.expressions.slice().forEach(e => calc.removeExpression(e.id));
  [...(st.objects || [])]
    .sort((a, b) => (a.order ?? 0) - (b.order ?? 0))
    .forEach(o => calc.addExpression(o.src, o.color,
      { visible: o.visible !== false, collapsed: !!o.collapsed,
        ...(o.style || {}), ...(o.domain || {}) }));
  Object.entries(st.params || {}).forEach(([n, p]) => {
    _paramRanges[n] = { minStr: String(p.min ?? '-5'), maxStr: String(p.max ?? '5'),
      mode: p.anim?.mode || 'pingpong', speedMul: p.anim?.speed || 1 };
    if (Number.isFinite(p.value)) calc.params[n] = p.value;
  });
  calc._rebuildAll();
  if (st.camera) calc.setCameraState(st.camera);
  if (st.display?.slice2d && st.display.slice2d.axis) {
    _defaultSlice = { axis: st.display.slice2d.axis, val: +st.display.slice2d.val || 0 };
    document.querySelectorAll('.axis-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.axis === _defaultSlice.axis));
    const sv = document.getElementById('slice-val');
    if (sv) sv.value = _defaultSlice.val;
  }
  if (st.display?.sidebarFont)
    document.getElementById('sidebar').style.setProperty('--sb-font', st.display.sidebarFont + 'px');
  _camViews = Array.isArray(st.views) ? st.views : [];
  if (st.layout?.mode === 'split') setSplit(true, st.layout.splitRatio || 0.38);
  else if (_splitOn) setSplit(false);
  // Restart animations that were running
  Object.entries(st.params || {}).forEach(([n, p]) => {
    if (!p.anim?.on) return;
    const mn = parseMathNum(_paramRanges[n].minStr), mx = parseMathNum(_paramRanges[n].maxStr);
    if (Number.isFinite(mn) && Number.isFinite(mx) && mn < mx)
      calc.startAnimation(n, { min: mn, max: mx,
        speed: (mx - mn) / 8 * (p.anim.speed || 1), mode: p.anim.mode });
  });
}

// ── §4.6: host-API — симетрія з MashGeoApp ─────────────────────────────
const G3D_OPTS = window.__mashG3dOpts || {};
const G3D_STORE_LOCAL = G3D_OPTS.storage !== 'none';

let _saveTimer = null;
function saveStateSoon() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    if (G3D_STORE_LOCAL) { try { localStorage.setItem('mash:g3d:state', JSON.stringify(collectState())); } catch(_) {} }
    if (typeof G3D_OPTS.onChange === 'function') { try { G3D_OPTS.onChange(collectState()); } catch(_) {} }
  }, 400);
}
const _g3dUnload = () => {
  if (G3D_STORE_LOCAL) { try { localStorage.setItem('mash:g3d:state', JSON.stringify(collectState())); } catch(_) {} }
};
window.addEventListener('beforeunload', _g3dUnload);

window.MashG3dApp = {
  serialize: () => collectState(),
  loadScene: (scene) => { applyState(scene); renderRows(); renderParams(); saveStateSoon(); },
  destroy:   () => {
    clearTimeout(_saveTimer);
    window.removeEventListener('beforeunload', _g3dUnload);
    clearInterval(_camPollTimer);
    try { calc.destroy && calc.destroy(); } catch(_) {}
    delete window.MashG3dApp;
  },
};

// Camera autosave — poll every 2 s, save only if moved
let _lastCamKey = '';
const _camPollTimer = setInterval(() => {
  try {
    const c = calc.getCameraState();
    const key = c.position.map(v => v.toFixed(2)).join(',') + '|' +
                c.target.map(v => v.toFixed(2)).join(',') + '|' + c.projection;
    if (_lastCamKey && key !== _lastCamKey) saveStateSoon();
    _lastCamKey = key;
  } catch(_) {}
}, 2000);

function loadInitialState() {
  if (G3D_OPTS.state) return G3D_OPTS.state;
  if (location.hash.length > 2) {
    try {
      const st = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));
      if (st && (st.objects || st.expressions)) return st;
    } catch(_) {}
  }
  try {
    const st = JSON.parse(localStorage.getItem('mash:g3d:state') || localStorage.getItem('g3d-state'));
    if (st && ((st.objects && st.objects.length) || (st.expressions && st.expressions.length))) return st;
  } catch(_) {}
  return null;
}

document.getElementById('btn-share').addEventListener('click', function() {
  try {
    const json = JSON.stringify(collectState());
    const hash = btoa(unescape(encodeURIComponent(json)));
    const url = location.origin + location.pathname + '#' + hash;
    history.replaceState(null, '', '#' + hash);
    navigator.clipboard.writeText(url).then(() => {
      const old = this.innerHTML;
      this.innerHTML = url.length > 2000 ? '&#10003; Скопійовано (довгий URL)' : '&#10003; Скопійовано';
      setTimeout(() => { this.innerHTML = old; }, 1600);
    });
  } catch(_) {}
});

const _initState = loadInitialState();
if (_initState) {
  applyState(_initState);
} else {
  calc.addExpression('z = sin(x) * cos(y)', '#2d70b3');
  calc.addExpression('(cos(t), sin(t), t/4)', '#c74440');
}
renderRows(); renderParams();
window.__g3d = calc;
window.__g2d = () => calc2d;
window.__sync2D = () => { sync2D(); return _2dAdded.length; };
window.__derive2D = derive2D;
window.__activeSlice2D = activeSlice2D;
setTimeout(renderRows, 400);
setTimeout(() => { pushUndoSoon(); }, 600); // базовий снапшот для undo
</script>
