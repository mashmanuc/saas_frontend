[build]
  publish = "dist"
  command = "npm run build"

# API proxy — must come BEFORE the SPA fallback
[[redirects]]
  from = "/api/*"
  to = "https://api.m4sh.org/api/:splat"
  status = 200
  force = true

# Media proxy (avatars, snapshots, etc.)
[[redirects]]
  from = "/media/*"
  to = "https://api.m4sh.org/media/:splat"
  status = 200
  force = true

# Cache headers — prevent stale index.html
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback — must be LAST
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
