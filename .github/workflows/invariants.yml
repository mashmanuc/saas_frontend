name: SSOT Invariants (Frontend)

# Phase 4 — DUMB GREP enforcement + lint + typecheck + tests.
# Non-bypassable (Husky може --no-verify, CI ні).
#
# Branch protection: GitHub Settings → Branches → master → Require status check
# "ssot-grep-gates-fe" + "test-frontend".

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ssot-grep-gates-fe:
    name: SSOT grep gates (LAW §12 FE, SUPPRESS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: LAW §12 FE forbidden constants
        shell: bash
        run: |
          set -eo pipefail
          HITS=$(grep -rEn 'MAX_LOCK_RETRIES|consecutive409|MAX_409_PER_SESSION|PAUSE_AFTER_CONSECUTIVE|lockRetryCount' \
            src --include='*.ts' --include='*.tsx' --include='*.js' --include='*.vue' 2>/dev/null \
            | grep -v '/__tests__/\|\.spec\.\|\.test\.\|/archive/' \
            | grep -vE '^[^:]+:[0-9]+:\s*(//|\*|/\*)' || true)
          if [ -n "$HITS" ]; then
            echo "::error::LAW §12 violated (PR3 deprecated constants):"
            echo "$HITS"
            exit 1
          fi
          echo "✅ LAW §12 FE OK"

      - name: SUPPRESS strict (@ts-ignore + file-level /* eslint-disable */)
        shell: bash
        run: |
          set -eo pipefail
          HITS=$(grep -rEn '@ts-ignore|/\*[[:space:]]*eslint-disable[[:space:]]*\*/' \
            src --include='*.ts' --include='*.tsx' --include='*.js' --include='*.vue' 2>/dev/null \
            | grep -v '/__tests__/\|\.spec\.\|\.test\.' || true)
          if [ -n "$HITS" ]; then
            echo "::error::SUPPRESS strict violated:"
            echo "$HITS"
            echo ""
            echo "Fix: @ts-ignore → @ts-expect-error з explanation; file-level eslint-disable → disable specific rules"
            exit 1
          fi
          echo "✅ SUPPRESS OK"

      - name: Legacy FE API methods stay deleted
        shell: bash
        run: |
          set -eo pipefail
          # Перевіряємо що FE-side не resurrect deleted methods.
          HITS=$(grep -rEn '\b(diffSave|streamSave|beaconSave)\s*[:(=]' \
            src/modules/winterboard/api 2>/dev/null \
            | grep -vE '^[^:]+:[0-9]+:\s*(//|\*|/\*)' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Legacy FE API methods resurrected:"
            echo "$HITS"
            echo "PR-A (FE commit 8026b53) DELETED these — use opsSync.flush()."
            exit 1
          fi
          echo "✅ Legacy FE API methods stay deleted"

      # ──────────────────────────────────────────────────────────────────
      # Phase RS PR-RS-ENF-2 (2026-04-30): runtime invariant enforcement
      # ──────────────────────────────────────────────────────────────────

      - name: INV-ENF stray INVARIANT VIOLATION strings (FE)
        shell: bash
        # Single source for emit: src/utils/invariantGuard.ts.
        # Anywhere else = bypass of telemetry pipeline → wb_invariant_violations_total
        # counter (BE bridge у PR-RS-E4) + alert routing.
        run: |
          set -eo pipefail
          HITS=$(grep -rEn '\[INVARIANT VIOLATION\]' \
            src --include='*.ts' --include='*.tsx' --include='*.js' --include='*.vue' 2>/dev/null \
            | grep -v 'invariantGuard\.ts\|/__tests__/\|\.spec\.\|\.test\.\|/archive/' \
            | grep -vE '^[^:]+:[0-9]+:\s*(//|\*|/\*)' || true)
          if [ -n "$HITS" ]; then
            echo "::error::INV-ENF violated — stray '[INVARIANT VIOLATION]' strings outside guard module:"
            echo "$HITS"
            echo ""
            echo "Fix: import { violate } from '@/utils/invariantGuard'"
            echo "Then call: violate('CODE', 'details', context?)"
            echo "Reference: saas_docs/domains/winterboard/phase_RS_runtime_stability/PLAN.md SECTION ENF"
            exit 1
          fi
          echo "✅ INV-ENF OK"

      - name: INV-FE-5 direct WebGLRenderer construction
        shell: bash
        # All WebGL contexts MUST be created via useThreeRenderer() composable
        # для guaranteed onUnmounted cleanup (renderer.dispose() + forceContextLoss).
        # Vendor exempted — planned migration наступна phase.
        run: |
          set -eo pipefail
          HITS=$(grep -rEn 'new[[:space:]]+(THREE\.)?WebGLRenderer\b' \
            src --include='*.ts' --include='*.tsx' --include='*.js' --include='*.vue' 2>/dev/null \
            | grep -v 'useThreeRenderer\.ts\|/vendor/\|/__tests__/\|\.spec\.\|\.test\.' \
            | grep -vE '^[^:]+:[0-9]+:\s*(//|\*|/\*)' || true)
          if [ -n "$HITS" ]; then
            echo "::error::INV-FE-5 violated — direct WebGLRenderer construction:"
            echo "$HITS"
            echo ""
            echo "Fix: import { useThreeRenderer } from '@/modules/winterboard/composables/useThreeRenderer'"
            echo "See: saas_docs/domains/winterboard/phase_RS_runtime_stability/PLAN.md SECTION C"
            exit 1
          fi
          echo "✅ INV-FE-5 OK"

  test-frontend:
    name: Frontend lint + typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit -- --run
